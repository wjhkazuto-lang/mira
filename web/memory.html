<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira 的记忆</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>Mira 的记忆</h1>
      <a href="/">回到聊天</a>
    </header>
    <section>
      <div class="status-row">
        <p id="memory-status" role="status" aria-live="polite">正在检查整理状态…</p>
        <button id="backup-now" type="button">立即备份</button>
      </div>
      <h2>最近她记住了什么</h2>
      <ul class="log-list" id="log"></ul>
      <div class="tabs" id="tabs"></div>
      <input class="search" id="search" type="search" placeholder="搜索她能想起来的内容（回车）">
      <div id="list"></div>
    </section>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/static/memory.js"></script>
</body>
</html>
